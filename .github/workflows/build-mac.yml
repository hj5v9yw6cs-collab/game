name: Сборка для Mac

# Сборка на Mac расходует минуты GitHub Actions в 10 раз быстрее обычной,
# поэтому она запускается кнопкой «Run workflow», при обновлении main и для версий v*.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-mac:
    runs-on: macos-14   # Apple Silicon (M1/M2/M3/M4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements.txt pyinstaller pillow pytest

      - name: Тесты уроков и песочницы
        run: python -m pytest -q tests

      - name: Иконка
        run: QT_QPA_PLATFORM=offscreen python tools/make_icon.py build/icon.png

      # Код игрока выполняется Python-ом внутри .app, поэтому модули, которые изучаются в уроках
      # (и популярные модули стандартной библиотеки), должны попасть в сборку, даже если игра их не импортирует.
      - name: Сборка Robofarm.app
        run: |
          HIDDEN=""
          for m in csv json datetime calendar collections pathlib glob shutil math statistics random re \
                   itertools functools string decimal fractions textwrap time zipfile difflib pprint \
                   urllib.request urllib.parse html; do
            HIDDEN="$HIDDEN --hidden-import $m"
          done
          pyinstaller --noconfirm --windowed --name Robofarm \
            --osx-bundle-identifier com.robofarm.game \
            --icon build/icon.png \
            --add-data "robofarm/data:robofarm/data" \
            $HIDDEN \
            main.py
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Робоферма" dist/Robofarm.app/Contents/Info.plist || true
          codesign --force --deep --sign - dist/Robofarm.app

      - name: Проверка, что песочница запускается внутри .app
        run: |
          echo '{"code": "print(2 + 2)", "beds": []}' | dist/Robofarm.app/Contents/MacOS/Robofarm --sandbox | grep '"stdout": "4\\n"'
          echo '{"code": "import csv, json, datetime, pathlib, collections, statistics\nprint(\"ok\")", "beds": []}' \
            | dist/Robofarm.app/Contents/MacOS/Robofarm --sandbox | grep '"stdout": "ok\\n"'

      - name: Упаковка
        run: cd dist && ditto -c -k --keepParent Robofarm.app Robofarm-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Robofarm-mac
          path: dist/Robofarm-mac.zip
